plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.service'
version = '0.0.1-SNAPSHOT'
description = 'A-Law'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.6'
    implementation 'org.springframework.boot:spring-boot-starter-security:3.5.6'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client:3.5.6'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.5.6' // 요청 DTO 검증

    // Data
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.6'
    implementation 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb:3.5.6'
//    implementation 'org.springframework.boot:spring-boot-starter-data-neo4j:3.5.6'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.5.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind'


    // Json Web Token
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    // Java Simplified Encryption
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.6'
    testImplementation 'org.springframework.security:spring-security-test:6.5.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    testRuntimeOnly 'com.h2database:h2'

    // ArchUnit
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    // Testcontainers
    testImplementation 'org.testcontainers:testcontainers:1.21.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:mongodb:1.21.3'
    testImplementation 'org.testcontainers:neo4j:1.21.3'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers:3.5.6'

    // S3 관련
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.0.0'

    /// QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    /// webflux
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // RabbitMQ
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // health check
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}


tasks.named('test') {
    useJUnitPlatform()
}
