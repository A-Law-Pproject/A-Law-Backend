services:
  spring:
    image: ${DOCKER_USERNAME}/alaw-be:latest
    container_name: alaw-spring
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    depends_on:
      - postgresql
      - mongo
      - redis
      - rabbitmq
    networks:
      - alaw-network

  postgresql:
    image: postgres:15
    container_name: alaw-postgres
    networks:
      - alaw-network  # 추가됨
    volumes:
      - ./postgres/conf:/etc/postgresql/conf.d   # 필요 시 설정 파일 마운트
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d  # 초기 SQL 스크립트(선택)
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  # MongoDB
  mongo:
      image: mongo:6.0
      container_name: alaw-mongo
      networks:
        - alaw-network  # 추가됨
      ports:
      - '27017:27017'
      volumes:
      - ./mongo/data:/data/db
      environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

  # Redis
  redis:
    image: redis:7.2.5
    container_name: alaw-redis
    networks:
      - alaw-network  # 추가됨
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: alaw-rabbitmq
    networks:
      - alaw-network  # 추가됨
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/log:/var/log/rabbitmq
      - ./rabbitmq/conf:/etc/rabbitmq  # 필요 시 설정 파일 마운트
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5


networks:
  alaw-network:
    external: true
