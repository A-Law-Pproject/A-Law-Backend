name: A-LAW CICD 파이프라인

on:
  push:
    branches:
      - develop
      - main
      - qa/release-v0.0.1

jobs:

  build-push-image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: application.yml 생성
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > src/main/resources/application.yml

      - name: 환경변수 로드
        run: |
          echo "${{ secrets.ENV }}" > .env
          set -a && source .env && set +a
          echo "::add-mask::${DOCKER_ACCESS_TOKEN}"
          echo "DOCKER_USERNAME=${DOCKER_USERNAME}" >> $GITHUB_ENV
          echo "DOCKER_ACCESS_TOKEN=${DOCKER_ACCESS_TOKEN}" >> $GITHUB_ENV

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/alaw-be:latest
            ${{ secrets.DOCKER_USERNAME }}/alaw-be:${{ github.sha }}

  deploy:
    runs-on: ubuntu-22.04
    needs: build-push-image
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: 환경변수 로드
        run: |
          echo "${{ secrets.ENV }}" > .env
          set -a && source .env && set +a
          echo "::add-mask::${EC2_PUBLIC_IP}"
          echo "EC2_PUBLIC_IP=${EC2_PUBLIC_IP}" >> $GITHUB_ENV
          echo "SSH_USER=${SSH_USER}" >> $GITHUB_ENV

      - name: .env 파일 EC2에 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: ".env"
          target: "/home/ubuntu/app/"

      - name: docker-compose.yml 전달
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker/docker-compose.yml"
          target: "/home/ubuntu/app/"
          strip_components: 1

      - name: EC2에서 docker-compose 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_PUBLIC_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/app/
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
