<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Law API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #888;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 16px 48px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            background: #4361ee;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #3a56d4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>A-Law API Server</h1>
        <p>Backend API is running.</p>
        <a class="btn" href="/api/v1/swagger-ui/index.html">Swagger UI</a>

</html>
